<h2><i>An Exceptional Selection </I></h2>
<h3><i> The Defense Medal (1.42 inches, silver 800 fine) was established at Aug 16 1945 and awarded to Canadians for 6 months services in Britain between Sept 3  1939 and Sept 2 1945. Total Issued: 325,000. </i></h3>
